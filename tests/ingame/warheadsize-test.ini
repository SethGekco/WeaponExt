; =============================================================================
; WarheadSize in-game test (DESIGN.md section 9, steps 1-4a)
;
; Append to rulesmd.ini. Keys merge into sections that already exist.
; Requires WeaponExt.dll in the Syringe -i= list (wine-game.sh +
; ClientDefinitions.ini). For the anim checks (C) WeaponExt must come BEFORE
; Phobos in that list.
;
; Harness: CommandBarExt tactical-bar button 14 ("EffectProbe"). It detonates
; [CBEProbeWH] through a real BulletClass::Detonate on every SELECTED unit you
; own, so it runs through WeaponExt's 0x4690C1 / 0x469AA4 seats. One click =
; a WarheadSize buff on the selected units, alongside the existing green-tint
; AttachEffect.
;
; Replace TESTWH below with the warhead of the splash weapon you test with
; (a unit whose explosions you can see and compare, e.g. an artillery or
; rocket unit), and TESTWH_BIG with a larger explosion anim you already have.
; =============================================================================

[CombatDamage]
WarheadSize.MultiplierCap=3.0       ; generous; the test uses x2
; WarheadSize.EngineSpreadLimit=    ; leave UNSET so the limit is measured + logged

[CBEProbeWH]
; Button 14 now also buffs the selected units: their shots scale x2 for
; 900 frames. CBEProbeWH is aimed at the unit itself, so with CellSpread=0
; exactly the targeted unit gets it; with a spread, your own units nearby too.
WarheadSize.Attach=2.0
WarheadSize.Attach.Duration=900
WarheadSize.Attach.Houses=owner

[TESTWH]
WarheadSize.AnimScale=yes           ; step 4a: tag + probe log only (no visual change yet)
WarheadSize.AnimScale.Max=3.0
; Optional step 2 art swap -- uncomment and point at a bigger anim:
; WarheadSize.AnimList.Scaled=TESTWH_BIG
; WarheadSize.AnimList.Threshold=1.5

; =============================================================================
; WHAT TO DO
;   1. Skirmish. Build two of the test unit. Select ONE, press button 14.
;   2. Within ~60 s at normal speed, have both fire at a cluster of enemies.
;   3. Quit, send debug.log.
;
; WHAT TO LOOK FOR (debug.log, all lines prefixed [WeaponExt])
;   A. Load:     "[CombatDamage] WarheadSize ... multCap=3.00 ..."
;                "CBEProbeWH: WarheadSize.Attach=2.00 for 900 frames, houses=0x1"
;                "TESTWH: WarheadSize exempt=0 ..."
;   B. Scaling:  on the buffed unit's FIRST shot:
;                "WarheadSize: engine spread table (0x7ED3D0) raw entries 0-16: ..."
;                "WarheadSize: engine spread limit measured as N cells."
;                -> the N is the number the encyclopedia is missing; please
;                   paste the raw-entries line too.
;                On screen: the buffed unit's splash hits a visibly wider
;                area than the unbuffed twin's. After ~60 s they match again.
;   C. Anims:    "[animscale] path=0x423122 anim=... scale=2.00 ..."
;                (or path=0x422CD8). Present = the CTOR handoff and the
;                draw path both work. ABSENT while B worked = the 0x469C46
;                seat is starved by Phobos' handler (load order), which also
;                settles an open question in the encyclopedia.
;   D. Overflow: only if TESTWH's scaled CellSpread exceeds the measured
;                limit: enemies in the outer ring should take EDGE damage
;                (PercentAtMax), not full damage.
;
; NOT exercised by this test: fire-time capture when the firer dies mid-flight
; (kill the buffed unit while its shell is in the air to check it: the shell
; should still land scaled), save -> load behaviour.
; =============================================================================
